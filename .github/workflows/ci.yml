name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run mocked Playwright E2E checks"
        type: boolean
        default: false
      run_docker:
        description: "Run ignored Docker sandbox checks"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Build web UI for desktop checks
        working-directory: apps/web-ui
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Generated sandbox registry check
        run: tools/generate-sandbox-registry --check

      - name: Generated schema TypeScript check
        run: tools/generate-schema-types --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Schema check (Rust validator)
        run: cargo run --bin schema-validator -- schemas

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python Tools
    runs-on: ubuntu-latest
    env:
      GATEWAY_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/llm-gateway/requirements.txt
            tools/prompt-tester/requirements.txt

      - name: Test LLM gateway
        run: |
          python -m venv services/llm-gateway/.venv
          services/llm-gateway/.venv/bin/python -m pip install -q --upgrade pip
          services/llm-gateway/.venv/bin/python -m pip install -q -r services/llm-gateway/requirements.txt pytest pytest-asyncio httpx tenacity
          PYTHONPATH="$PWD/services/llm-gateway" services/llm-gateway/.venv/bin/python -m pytest services/llm-gateway/tests

      - name: Test prompt tester
        run: |
          python -m venv tools/prompt-tester/.venv
          tools/prompt-tester/.venv/bin/python -m pip install -q --upgrade pip
          tools/prompt-tester/.venv/bin/python -m pip install -q -r tools/prompt-tester/requirements.txt
          PYTHONPATH="$PWD/tools/prompt-tester" tools/prompt-tester/.venv/bin/python -m pytest tools/prompt-tester/tests

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  docker:
    name: Docker Sandbox
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Build web UI for desktop checks
        working-directory: apps/web-ui
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Docker sandbox gate
        run: ./scripts/check --skip-python --with-docker
